name: Build Messenger Z

on:
  schedule:
    # ~biweekly: 1st and 15th of each month, 00:00 UTC
    - cron: "0 0 1,15 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"  # lspatch.jar is compiled for Java 21 (class file v65)

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make scripts executable
        run: chmod +x ./gradlew tools/*.sh

      - name: Determine latest Messenger version
        id: ver
        run: |
          V=$(bash tools/fetch-messenger.sh version)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Latest stable Messenger: $V"

      - name: Decide whether to build
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.ver.outputs.version }}"
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && gh release view "v$V" >/dev/null 2>&1; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Release v$V already exists; nothing new to build."
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download stock Messenger
        if: steps.gate.outputs.build == 'true'
        run: bash tools/fetch-messenger.sh download messenger.apk

      - name: Build Messenger Z module
        if: steps.gate.outputs.build == 'true'
        env:
          VER_CODE: ${{ 11000 + github.run_number }}
          MSGR_VER: ${{ steps.ver.outputs.version }}
        run: ./gradlew :app:assembleDebug -PverCode="$VER_CODE" -PmsgrVer="$MSGR_VER" --console=plain

      - name: Patch (strip perms + sign + LSPatch embed)
        if: steps.gate.outputs.build == 'true'
        run: |
          bash tools/build-ci.sh messenger.apk app/build/outputs/apk/debug/app-debug.apk dist
          V="${{ steps.ver.outputs.version }}"
          OUT=$(ls dist/*lspatched.apk | head -1)
          cp "$OUT" "MessengerZ-$V.apk"
          echo "Built MessengerZ-$V.apk"

      - name: Publish prerelease
        if: steps.gate.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.ver.outputs.version }}"
          MODVER=$(grep -oE 'versionName = "[^"]*"' app/build.gradle.kts | grep -oE '[0-9][0-9.]*' | head -1)
          NOTES="**Messenger Z ${MODVER}** — patched onto Messenger ${V}. Non-root; installs alongside the Facebook app.

          > ⚠️ **Pre-release.** This is an automated build that hasn't been manually checked yet. If Messenger changed internally since the last update, some features may not work until a fix ships. A confirmed-working build is published as the latest (non-pre-release) version.

          **Features:** hide seen indicator, hide typing indicator, log unsent messages, version spoof.

          Open settings by long-pressing the **Messenger** title."
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" "MessengerZ-$V.apk" --clobber
          else
            gh release create "v$V" "MessengerZ-$V.apk" \
              --title "Messenger Z ${MODVER} (Messenger ${V})" \
              --prerelease \
              --notes "$NOTES"
          fi

      - name: Maintainer reminder (internal, not shown to users)
        if: steps.gate.outputs.build == 'true'
        run: |
          {
            echo "### Prerelease v${{ steps.ver.outputs.version }} published"
            echo ""
            echo "**Before promoting:** install, open the Debug Console, confirm No Seen and No Typing still fire."
            echo "Expected command ids live in \`docs/hook-ids.md\`. If a hook is dead, the id drifted — re-capture via the console (see \`docs/maintenance.md\`), update the constant, and re-run."
            echo ""
            echo "Then edit the release and uncheck **pre-release** to ship it to Obtainium."
          } >> "$GITHUB_STEP_SUMMARY"
