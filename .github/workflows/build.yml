name: Build Messenger Z + Facebook Z

on:
  schedule:
    # ~biweekly: 1st and 15th of each month, 00:00 UTC
    - cron: "0 0 1,15 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"  # lspatch.jar is compiled for Java 21 (class file v65)

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make scripts executable
        run: chmod +x ./gradlew tools/*.sh

      - name: Determine latest Messenger and Facebook versions
        id: ver
        run: |
          V=$(bash tools/fetch-messenger.sh version)
          FV=$(bash tools/fetch-facebook.sh version)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "fbversion=$FV" >> "$GITHUB_OUTPUT"
          echo "Latest stable Messenger: $V, Facebook: $FV"

      - name: Decide whether to build
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.ver.outputs.version }}"
          FV="${{ steps.ver.outputs.fbversion }}"
          # One release per Messenger version (tag v$V); a new Facebook version rebuilds it.
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && gh release view "v$V" --json assets -q '.assets[].name' 2>/dev/null | grep -qx "FacebookZ-$FV.apk"; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Release v$V already has Messenger $V + Facebook $FV; nothing new to build."
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download stock Messenger and Facebook
        if: steps.gate.outputs.build == 'true'
        run: |
          bash tools/fetch-messenger.sh download messenger.apk
          bash tools/fetch-facebook.sh download facebook.apk

      - name: Build Messenger Z and Facebook Z modules
        if: steps.gate.outputs.build == 'true'
        env:
          RUN_NUMBER: ${{ github.run_number }}
          MSGR_VER: ${{ steps.ver.outputs.version }}
          FB_VER: ${{ steps.ver.outputs.fbversion }}
        run: |
          VER_CODE=$((11000 + RUN_NUMBER))
          ./gradlew :messenger:assembleDebug :facebook:assembleDebug -PverCode="$VER_CODE" -PmsgrVer="$MSGR_VER" -PfbVer="$FB_VER" --console=plain

      - name: Patch (strip perms + sign + LSPatch embed)
        if: steps.gate.outputs.build == 'true'
        run: |
          bash tools/build-ci.sh messenger.apk app/build/outputs/apk/debug/messenger-debug.apk dist
          V="${{ steps.ver.outputs.version }}"
          OUT=$(ls dist/*lspatched.apk | head -1)
          cp "$OUT" "MessengerZ-$V.apk"
          FV="${{ steps.ver.outputs.fbversion }}"
          WORK=$PWD/tools/work-fb SIGBYPASS=1 bash tools/build-ci.sh facebook.apk facebook/build/outputs/apk/debug/facebook-debug.apk dist-fb
          cp "$(ls dist-fb/*lspatched.apk | head -1)" "FacebookZ-$FV.apk"
          echo "Built MessengerZ-$V.apk and FacebookZ-$FV.apk"

      - name: Publish prerelease
        if: steps.gate.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.ver.outputs.version }}"
          FV="${{ steps.ver.outputs.fbversion }}"
          MODVER=$(grep -oE '^zVersion=.*' gradle.properties | cut -d= -f2)
          {
            echo "**Messenger Z + Facebook Z ${MODVER}**, patched onto Messenger ${V} and Facebook ${FV}."
            echo ""
            echo "> ⚠️ **Pre-release.** This is an automated build that hasn't been manually checked yet. If Messenger or Facebook changed internally since the last update, some features may not work until a fix ships. A confirmed-working build is published as the latest (non-pre-release) version."
            echo ""
            cat docs/release-notes.md
          } > notes.md
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" "MessengerZ-$V.apk" "FacebookZ-$FV.apk" --clobber
          else
            gh release create "v$V" "MessengerZ-$V.apk" "FacebookZ-$FV.apk" \
              --title "Messenger Z + Facebook Z ${MODVER}" \
              --prerelease \
              --notes-file notes.md
          fi

      - name: Maintainer reminder (internal, not shown to users)
        if: steps.gate.outputs.build == 'true'
        run: |
          {
            echo "### Prerelease v${{ steps.ver.outputs.version }} published"
            echo ""
            echo "**Before promoting:** run /update (it verifies both apps on the emulator), or at least install, open the Debug Console, confirm No Seen and No Typing still fire, and check Facebook Z's startup log (story seen / progress / ads hooks found)."
            echo "Expected command ids live in \`docs/messenger/hook-ids.md\`. If a hook is dead, the id drifted — re-capture via the console (see \`docs/messenger/maintenance.md\`), update the constant, and re-run."
            echo ""
            echo "Then edit the release and uncheck **pre-release** to ship it to Obtainium."
          } >> "$GITHUB_STEP_SUMMARY"
